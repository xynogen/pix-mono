<svg xmlns="http://www.w3.org/2000/svg" width="304" height="160" viewBox="0 0 304 160" role="img" aria-labelledby="title">
  <title id="title">Pix — blueprint mosaic logo</title>
  <!-- Blueprint pieces on a 20-unit grid. Touching edges; no internal gutters. -->
  <g transform="translate(32 30)">
    <!-- P: cap, upper stem, crossbar, bowl edge, lower stem. -->
    <rect x="0" y="0" width="60" height="20" fill="#a9c1ff"/>
    <rect x="0" y="20" width="20" height="40" fill="#7aa2f7"/>
    <rect x="20" y="40" width="40" height="20" fill="#5277c3"/>
    <rect x="60" y="20" width="20" height="20" fill="#9d7cd8"/>
    <rect x="0" y="60" width="20" height="40" fill="#3d59a1"/>
    <!-- I: rectangular top beam, shaft, single square, bottom beam. -->
    <rect x="80" y="0" width="60" height="20" fill="#a9c1ff"/>
    <rect x="100" y="20" width="20" height="40" fill="#7aa2f7"/>
    <rect x="100" y="60" width="20" height="20" fill="#9d7cd8"/>
    <rect x="80" y="80" width="60" height="20" fill="#7aa2f7"/>
    <!-- X: two tall tips, five center squares, two wide feet. -->
    <rect x="140" y="0" width="20" height="40" fill="#5277c3"/>
    <rect x="160" y="20" width="20" height="20" fill="#7aa2f7"/>
    <rect x="220" y="0" width="20" height="40" fill="#5277c3"/>
    <rect x="200" y="20" width="20" height="20" fill="#7aa2f7"/>
    <rect x="180" y="40" width="20" height="20" fill="#9d7cd8"/>
    <rect x="160" y="60" width="20" height="20" fill="#5277c3"/>
    <rect x="200" y="60" width="20" height="20" fill="#5277c3"/>
    <rect x="140" y="80" width="40" height="20" fill="#3d59a1"/>
    <rect x="200" y="80" width="40" height="20" fill="#3d59a1"/>
  </g>
</svg>
