name: Publish

on:
  # The release tag IS the release signal — no race with a separate CI-completion
  # trigger. The job below requires a green CI run on this exact commit before
  # publishing, so the quality gate is enforced without re-running it here.
  push:
    tags: ["release-[0-9]*"]
  # Break-glass fallback from the Actions tab (operator takes responsibility).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read Actions API to query the CI run's conclusion for this commit.
      actions: read
      # Required for npm trusted publishing (OIDC) + provenance.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The tag points at the commit to release; github.sha is that commit.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Gate on CI: require a completed, successful CI run on THIS commit.
      # Polls (does not re-run the suite) so a tag pushed while CI is still
      # running waits instead of failing. A failed/cancelled CI aborts publish.
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do   # ~10 min ceiling (40 × 15s)
            CONCLUSION=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --workflow CI \
              --json status,conclusion \
              --jq 'map(select(.status=="completed"))[0].conclusion // ""')
            case "$CONCLUSION" in
              success)
                echo "CI is green on $GITHUB_SHA — proceeding."
                exit 0 ;;
              failure|cancelled|timed_out|startup_failure)
                echo "CI concluded '$CONCLUSION' on $GITHUB_SHA — aborting publish."
                exit 1 ;;
              *)
                echo "Waiting for CI to complete on $GITHUB_SHA… ($i/40)"
                sleep 15 ;;
            esac
          done
          echo "Timed out waiting for CI on $GITHUB_SHA — aborting publish."
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Same Bun as CI, so the published tarballs come from the tested toolchain.
          bun-version: 1.4.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Node 24 ships a compatible npm with its provenance dependencies intact.
      # Do not globally upgrade npm here: npm@latest has caused incomplete global
      # installations on GitHub runners (missing `sigstore` during --provenance).

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-publish guard: fail fast if any changed package forgot to
      # bump its version (already published to npm at that version).
      - name: Check versions not already on npm
        run: bun scripts/check-versions.ts

      # Publishes every package whose version is not yet on npm (idempotent).
      # Authentication is via OIDC trusted publishing (no NPM_TOKEN); provenance
      # is attached automatically.
      - name: Publish changed packages to npm
        run: bun run publish:all
        env:
          NPM_CONFIG_PROVENANCE: "true"
