name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Every Linux binary in packages/pix-runtime/src/binaries/catalog.ts, so tests use the real
      # tools. The runner image already has git, bash, ssh, scp, sshpass, sudo, aria2c, npm, and
      # npx. bun install gives pi. WSL-only, macOS-only, and Windows-only entries cannot run here.
      # ponytail: rtk is pinned with its checksum. Bump RTK_VERSION and the sha256 together.
      - name: Install test binaries
        env:
          RTK_VERSION: 0.50.0
          RTK_SHA256: bc2b8902b0d9c796c82ef45f16ae2307e17757afeca5ee156235a3dc7bda5f89
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep ffmpeg xclip wl-clipboard xdg-utils
          npm install -g hunkdiff@0.23.0
          asset=rtk-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/${asset}"
          echo "${RTK_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin rtk
          rg --version | head -1; ffmpeg -version | head -1; hunk --version; rtk --version

      # shellcheck ships with the ubuntu-latest runner image.
      - name: Shell scripts
        run: shellcheck scripts/*.sh

      - name: Static analysis
        run: bun run static-analysis

      # One suite run: the ratchet runs `bun test --coverage` and fails on test failures too.
      - name: Test + coverage (ratchet)
        run: bun scripts/coverage-ratchet.ts

  # Windows catches path, CRLF and symlink bugs the Linux job cannot. Tests only: lint, typecheck
  # and the tarball smoke are OS-independent, and coverage is ratcheted once, on Linux.
  # ponytail: only ripgrep is installed here (pix-graph needs it); other tests that need a binary skip.
  # ripgrep comes pinned from its GitHub release, not Chocolatey: a choco feed 504 exits 0 with
  # nothing installed. Bump RG_VERSION and the sha256 together.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install test binaries
        env:
          RG_VERSION: 15.2.0
          RG_SHA256: 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5
        run: |
          $name = "ripgrep-$env:RG_VERSION-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/BurntSushi/ripgrep/releases/download/$env:RG_VERSION/$name.zip" -OutFile rg.zip
          if ((Get-FileHash rg.zip -Algorithm SHA256).Hash -ne $env:RG_SHA256) { throw "rg.zip checksum mismatch" }
          Expand-Archive rg.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\$name\rg.exe" --version

      - name: Test
        run: bun run test
